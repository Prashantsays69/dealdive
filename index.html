<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DealDive — Game Deals Aggregator</title>
  <meta name="description" content="Discover the best PC game deals across Steam, Epic, GOG and more. Compare prices, track discounts, and never overpay for games." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Three.js WebGL Canvas (injected by scene3d.js, fallback anchor) -->
  <canvas id="three-canvas"></canvas>

  <div id="app">
    <!-- Header — floating minimal navbar -->
    <header id="site-header" class="header"></header>

    <!-- Hero — Full-screen 3D cinematic -->
    <section id="hero-3d" class="hero3d immersive-section"></section>

    <!-- Featured Games — Scroll-driven cinematic scenes -->
    <section id="featured-games" class="featured-games immersive-section"></section>

    <!-- Best Deals Gallery — Horizontal 3D gallery -->
    <section id="best-deals-gallery" class="best-deals-gallery immersive-section"></section>

    <!-- Platform Section — Interactive store tiles -->
    <section id="platform-section" class="platform-section immersive-section"></section>

    <!-- Trending Cards — Layered 3D cards -->
    <section id="trending-cards" class="trending-cards immersive-section"></section>

    <!-- CTA Section -->
    <section id="cta-section" class="cta-section immersive-section"></section>

    <!-- Main Content — Filter Bar + Deals Grid (preserved) -->
    <main id="main-content" class="main">
      <!-- Filter Bar -->
      <div id="filter-bar" class="filter-bar"></div>

      <!-- Deals Grid -->
      <div id="deals-container" class="deals-container">
        <div id="deals-grid" class="deals-grid"></div>
        <div id="scroll-sentinel" class="scroll-sentinel"></div>
      </div>
    </main>

    <!-- Search Modal -->
    <div id="search-modal" class="search-modal" aria-hidden="true"></div>

    <!-- Wishlist Panel -->
    <div id="wishlist-panel" class="wishlist-panel" aria-hidden="true"></div>

    <!-- Footer -->
    <footer id="site-footer" class="footer"></footer>
  </div>
</body>
</html>
