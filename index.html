<!DOCTYPE html>
<html lang="en" class="gl-on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DealDive — Editorial PC Game Deals &amp; Intelligence</title>
  <meta name="description" content="Discover the best PC game deals across Steam, Epic, GOG and authorized storefronts. Real-time pricing intelligence, price history and verified discounts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Scroll Progress Indicator -->
  <div class="progress" id="scroll-progress" aria-hidden="true"></div>

  <!-- Subtle Grain Overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- WebGL 3D Background Canvas -->
  <canvas id="gl" aria-hidden="true"></canvas>

  <!-- 1. MINIMAL NAV -->
  <header class="site-head" id="site-header"></header>

  <!-- Mobile Slide-out Drawer -->
  <div class="mobile-nav-drawer" id="mobile-nav-drawer" aria-hidden="true"></div>

  <!-- MAIN EDITORIAL CONTENT -->
  <main class="content" id="content">
    <!-- 2. EDITORIAL HERO -->
    <section class="section hero-section" id="hero" data-cam="hero"></section>

    <!-- 3. FEATURED DEALS (Large asymmetric editorial compositions) -->
    <section class="section featured-section" id="featured" data-cam="featured"></section>

    <!-- 4. DEAL CATEGORIES (Horizontal editorial sections) -->
    <section class="section categories-section" id="categories" data-cam="categories"></section>

    <!-- 5. GAME DISCOVERY (Searchable catalog + compact store tabs & filters) -->
    <section class="section discovery-section" id="discovery" data-cam="discovery">
      <div class="discovery-inner">
        <div class="discovery-header">
          <span class="meta-label">03 // GAME DISCOVERY &amp; CATALOG</span>
          <h2 class="discovery-title">Search &amp; Filter All Deals</h2>
          <p class="discovery-sub">Real-time authorized pricing from Steam, Epic, GOG, and verified merchants.</p>
        </div>

        <!-- Compact Horizontal Store Tabs -->
        <div id="store-tabs" class="store-tabs-wrapper"></div>

        <!-- Compact Functional Filter Bar -->
        <div id="filter-bar" class="filter-bar"></div>

        <!-- Deals Grid -->
        <div id="deals-container" class="deals-container">
          <div id="deals-grid" class="deals-grid"></div>
          <div id="scroll-sentinel" class="scroll-sentinel"></div>
        </div>
      </div>
    </section>

    <!-- 6. FOOTER (Large typography, minimal links, brand statement) -->
    <footer class="section site-foot" id="foot" data-cam="foot"></footer>
  </main>

  <!-- Search Modal -->
  <div id="search-modal" class="search-modal" aria-hidden="true"></div>

  <!-- Wishlist Panel -->
  <div id="wishlist-panel" class="wishlist-panel" aria-hidden="true"></div>

  <!-- Cinematic Game Detail Modal -->
  <div id="game-detail-modal" class="game-detail-modal" aria-hidden="true"></div>
</body>
</html>
