<!DOCTYPE html>
<html lang="en" class="gl-on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DealDive — Game Deals Aggregator</title>
  <meta name="description" content="Discover the best PC game deals across Steam, Epic, GOG and more. Compare prices, track discounts, and never overpay for games." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Scroll Progress Bar -->
  <div class="progress" id="scroll-progress" aria-hidden="true"></div>

  <!-- Subtle Film Grain Overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Three.js WebGL Canvas -->
  <canvas id="gl" aria-hidden="true"></canvas>

  <!-- Navigation -->
  <header class="site-head" id="site-header"></header>

  <!-- Mobile Navigation Drawer -->
  <div class="mobile-nav-drawer" id="mobile-nav-drawer" aria-hidden="true"></div>

  <div class="content" id="content">
    <!-- 01 — CINEMATIC HERO -->
    <section class="section hero" id="hero" data-cam="hero"></section>

    <!-- 02 — FEATURED DEAL: Massive editorial showcase -->
    <section class="section featured-deal-section" id="featured-deal" data-cam="featured-deal"></section>

    <!-- 03 — BEST DEALS: Editorial asymmetric grid -->
    <section class="section best-deals-section" id="best-deals" data-cam="best-deals"></section>

    <!-- 04 — TRENDING: High-rating / discount velocity -->
    <section class="section trending-section" id="trending" data-cam="trending"></section>

    <!-- 05 — DEAL CATEGORIES: Quick genre access -->
    <section class="section deal-categories-section" id="deal-categories" data-cam="categories"></section>

    <!-- 06 — STORE TABS: Horizontal verified platforms -->
    <section class="section store-tabs-section" id="store-tabs" data-cam="stores"></section>

    <!-- 07 — ALL DEALS: Catalog & filters -->
    <section class="section catalog-section" id="catalog" data-cam="catalog">
      <div class="catalog-inner">
        <div class="catalog-header">
          <div class="meta-label">CATALOG &amp; FILTER // ALL STORES</div>
          <h2 class="catalog-title">Explore All Game Deals</h2>
          <p class="catalog-sub">Real-time prices from Steam, Epic, GOG, and verified storefronts. Filter by price, rating, or store.</p>
        </div>

        <!-- Filter Bar -->
        <div id="filter-bar" class="filter-bar"></div>

        <!-- Deals Grid -->
        <div id="deals-container" class="deals-container">
          <div id="deals-grid" class="deals-grid"></div>
          <div id="scroll-sentinel" class="scroll-sentinel"></div>
        </div>
      </div>
    </section>

    <!-- 08 — FINAL CTA: Denmu-style typographic statement -->
    <section class="section cta-section" id="cta" data-cam="cta"></section>

    <!-- 09 — FOOTER: Minimal 4-column footer -->
    <footer class="section site-foot" id="foot" data-cam="foot"></footer>
  </div>

  <!-- Search Modal -->
  <div id="search-modal" class="search-modal" aria-hidden="true"></div>

  <!-- Wishlist Panel -->
  <div id="wishlist-panel" class="wishlist-panel" aria-hidden="true"></div>

  <!-- Cinematic Game Detail Modal -->
  <div id="game-detail-modal" class="game-detail-modal" aria-hidden="true"></div>
</body>
</html>
